<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 핫딜</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
      min-height: 100vh;
      padding-bottom: 48px;
    }

    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 20px 20px 14px;
      text-align: center;
      border-bottom: 1px solid #2a2a3e;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header h1 { font-size: 20px; font-weight: 800; }
    .header p { font-size: 12px; color: #888; margin-top: 4px; }

    .filter-bar {
      display: flex;
      gap: 8px;
      max-width: 480px;
      margin: 12px auto 0;
      padding: 0 4px;
    }

    .search-input {
      flex: 1;
      background: #0f0f1a;
      border: 1px solid #2a2a3e;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      color: #f0f0f0;
      outline: none;
    }

    .search-input::placeholder { color: #555; }
    .search-input:focus { border-color: #ff6b00; }

    .dd-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .dd-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f0f1a;
      border: 1px solid #2a2a3e;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      color: #f0f0f0;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
      transition: border-color 0.15s;
    }

    .dd-trigger:hover, .dd-wrap.open .dd-trigger {
      border-color: #ff6b00;
    }

    .dd-chevron {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      transition: transform 0.2s;
    }

    .dd-wrap.open .dd-chevron {
      transform: rotate(180deg);
    }

    .dd-menu {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 120px;
      max-height: 280px;
      overflow-y: auto;
      background: #1a1a2a;
      border: 1px solid #2a2a3e;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 100;
    }

    .dd-wrap.open .dd-menu {
      display: block;
    }

    .dd-item {
      list-style: none;
      padding: 10px 16px;
      font-size: 13px;
      cursor: pointer;
      color: #ccc;
      transition: background 0.1s, color 0.1s;
    }

    .dd-item:hover {
      background: #252535;
      color: #fff;
    }

    .dd-item.selected {
      color: #ff6b00;
      font-weight: 700;
    }

    .dd-item-all {
      border-bottom: 1px solid #2a2a3e;
      color: #888;
    }

    .day-section {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 14px 0;
    }

    .day-section.hidden { display: none; }

    .day-label {
      font-size: 13px;
      font-weight: 700;
      color: #ff6b00;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .day-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #2a2a2a;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 8px;
    }

    .card {
      display: flex;
      background: #1c1c1c;
      border-radius: 14px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      border: 1px solid #2a2a2a;
    }

    .card.hidden { display: none; }

    .card-img {
      position: relative;
      width: 110px;
      min-width: 110px;
      height: 110px;
      background: #252525;
      flex-shrink: 0;
    }

    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .img-placeholder {
      width: 100%;
      height: 100%;
      background: #2a2a2a;
    }

    .rank {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0,0,0,0.72);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
    }

    .card-body {
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      min-width: 0;
    }

    .name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.5;
      color: #ddd;
    }

    .price {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      margin-top: 6px;
    }

    .cta {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #ff6b00;
    }

    .notice {
      max-width: 480px;
      margin: 0 auto;
      padding: 10px 16px;
      font-size: 11px;
      color: #888;
      line-height: 1.6;
      text-align: center;
    }

    .no-results {
      max-width: 480px;
      margin: 40px auto;
      text-align: center;
      color: #555;
      font-size: 14px;
      display: none;
    }

    .skeleton-section {
      max-width: 480px;
      margin: 20px auto 0;
      padding: 0 14px;
    }

    .skeleton-label {
      height: 16px;
      width: 80px;
      background: #2a2a2a;
      border-radius: 4px;
      margin-bottom: 12px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .skeleton-card {
      display: flex;
      background: #1c1c1c;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #2a2a2a;
      margin-bottom: 10px;
      height: 110px;
    }

    .skeleton-img {
      width: 110px;
      min-width: 110px;
      background: #2a2a2a;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .skeleton-body {
      flex: 1;
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .skeleton-line {
      height: 13px;
      background: #2a2a2a;
      border-radius: 4px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .skeleton-line.short { width: 60%; }
    .skeleton-line.shorter { width: 40%; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="pageTitle">오늘의 핫딜</h1>
    <p>매일 저녁 8시 업데이트</p>
    <div class="filter-bar">
      <input class="search-input" id="searchInput" type="text" placeholder="상품명 검색..." autocomplete="off">
      <div class="dd-wrap" id="ddWrap">
        <div class="dd-trigger" id="ddTrigger">
          <span id="ddLabel">전체 날짜</span>
          <svg class="dd-chevron" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 4l4 4 4-4" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <ul class="dd-menu" id="ddMenu">
          <li class="dd-item dd-item-all selected" data-value="">전체 날짜</li>
        </ul>
      </div>
    </div>
  </div>
  <p class="notice">이 포스팅은 쿠팡 파트너스 활동의 일환으로 이에 따른 일정액의 수수료를 제공받습니다.</p>

  <div id="content"></div>
  <p class="no-results" id="noResults">검색 결과가 없습니다.</p>

  <script>
    const CHANNEL_LABELS = {"coupang-goldbox": "오늘의 핫딜", "coupang-best": "인기상품", "coupang-search": "추천상품", "toss-daily-deals": "오늘의 특가"};
    const INITIAL_DAYS = 7;

    const params = new URLSearchParams(location.search);
    const channel = params.get('ch') || 'coupang-goldbox';

    document.getElementById('pageTitle').textContent = CHANNEL_LABELS[channel] || '오늘의 핫딜';

    let allEntries = [];
    let renderedDates = new Set();
    let selectedDate = '';

    const searchInput = document.getElementById('searchInput');
    const ddWrap = document.getElementById('ddWrap');
    const ddTrigger = document.getElementById('ddTrigger');
    const ddLabel = document.getElementById('ddLabel');
    const ddMenu = document.getElementById('ddMenu');
    const content = document.getElementById('content');
    const noResults = document.getElementById('noResults');

    function showSkeleton() {
      const skeletonCard = `
        <div class="skeleton-card">
          <div class="skeleton-img"></div>
          <div class="skeleton-body">
            <div class="skeleton-line"></div>
            <div class="skeleton-line short"></div>
            <div class="skeleton-line shorter"></div>
          </div>
        </div>`;
      content.innerHTML = Array(2).fill('').map(() => `
        <div class="skeleton-section">
          <div class="skeleton-label"></div>
          ${Array(5).fill(skeletonCard).join('')}
        </div>
      `).join('');
    }

    function cardHtml(rank, p) {
      const link = p.affiliate_url || p.url || '#';
      const imgHtml = p.image_url
        ? `<img src="${p.image_url}" alt="" loading="lazy">`
        : '<div class="img-placeholder"></div>';
      return `
        <a class="card" href="${link}" target="_blank" rel="noopener noreferrer sponsored">
          <div class="card-img">
            ${imgHtml}
            <span class="rank">#${rank}</span>
          </div>
          <div class="card-body">
            <p class="name">${p.name || ''}</p>
            <p class="price">${p.price || ''}</p>
            <p class="cta">지금 확인하기 →</p>
          </div>
        </a>`;
    }

    function sectionHtml(entry) {
      const cards = entry.products.map((p, i) => cardHtml(i + 1, p)).join('');
      return `
        <div class="day-section" id="${entry.date}">
          <div class="day-label">${entry.label}</div>
          <div class="cards">${cards}</div>
        </div>`;
    }

    function ensureRendered(dateVal) {
      if (renderedDates.has(dateVal)) return;
      const entry = allEntries.find(e => e.date === dateVal);
      if (!entry) return;
      content.insertAdjacentHTML('beforeend', sectionHtml(entry));
      renderedDates.add(dateVal);
    }

    function applyFilter() {
      const keyword = searchInput.value.trim().toLowerCase();
      if (selectedDate) ensureRendered(selectedDate);
      let anyVisible = false;
      document.querySelectorAll('.day-section').forEach(section => {
        const dateMatch = !selectedDate || section.id === selectedDate;
        let sectionHasVisible = false;
        section.querySelectorAll('.card').forEach(card => {
          const name = card.querySelector('.name').textContent.toLowerCase();
          const show = dateMatch && (!keyword || name.includes(keyword));
          card.classList.toggle('hidden', !show);
          if (show) sectionHasVisible = true;
        });
        section.classList.toggle('hidden', !sectionHasVisible);
        if (sectionHasVisible) anyVisible = true;
      });
      noResults.style.display = anyVisible ? 'none' : 'block';
    }

    async function loadData() {
      showSkeleton();
      try {
        const res = await fetch(`${channel}/data.json`);
        if (!res.ok) throw new Error(res.status);
        allEntries = await res.json();
      } catch (e) {
        content.innerHTML = '<p style="text-align:center;color:#555;padding:40px">데이터를 불러올 수 없습니다.</p>';
        return;
      }

      // 드롭다운에 날짜 목록 추가
      allEntries.forEach(e => {
        const li = document.createElement('li');
        li.className = 'dd-item';
        li.dataset.value = e.date;
        li.textContent = e.label;
        ddMenu.appendChild(li);
      });

      // 최근 INITIAL_DAYS일만 초기 렌더링
      content.innerHTML = '';
      allEntries.slice(0, INITIAL_DAYS).forEach(e => {
        content.insertAdjacentHTML('beforeend', sectionHtml(e));
        renderedDates.add(e.date);
      });
    }

    ddTrigger.addEventListener('click', e => {
      e.stopPropagation();
      ddWrap.classList.toggle('open');
    });
    document.addEventListener('click', () => ddWrap.classList.remove('open'));
    ddMenu.addEventListener('click', e => {
      const item = e.target.closest('.dd-item');
      if (!item) return;
      selectedDate = item.dataset.value;
      ddLabel.textContent = item.textContent;
      ddMenu.querySelectorAll('.dd-item').forEach(el => el.classList.remove('selected'));
      item.classList.add('selected');
      ddWrap.classList.remove('open');
      applyFilter();
    });

    searchInput.addEventListener('input', applyFilter);

    loadData();
  </script>
</body>
</html>
